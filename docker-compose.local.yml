services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: exin
      POSTGRES_PASSWORD: exin_local
      POSTGRES_DB: exin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exin"]
      interval: 5s
      retries: 10

  api:
    environment:
      APP_ENV: local-prod
      DATABASE_URL: postgresql+psycopg://exin:exin_local@db:5432/exin
      JWT_SECRET: local-only-not-a-secret
    depends_on:
      db:
        condition: service_healthy

  nginx:
    volumes:
      - ./certs:/etc/nginx/certs:ro

volumes:
  pgdata:
