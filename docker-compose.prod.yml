services:
  api:
    image: ${API_IMAGE:-exin-api:local}
    build: ./backend
    env_file:
      - path: .env.prod
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    # Same image as the API, different command: processes the upload queue.
    image: ${API_IMAGE:-exin-api:local}
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env.prod
        required: false
    restart: unless-stopped
    stop_grace_period: 30s # let the current job finish on deploy

  nginx:
    image: ${WEB_IMAGE:-exin-web:local}
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/ssl/cloudflare:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
